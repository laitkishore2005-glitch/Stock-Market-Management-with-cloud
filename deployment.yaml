apiVersion: apps/v1
kind: Deployment
metadata:
  name: inditrade-app

spec:
  replicas: 2
  selector:
    matchLabels:
      app: inditrade-app

  template:
    metadata:
      labels:
        app: inditrade-app

    spec:
      containers:
      - name: inditrade-app
        image: yourusername/inditrade-app
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: inditrade-service

spec:
  type: NodePort
  selector:
    app: inditrade-app

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007
